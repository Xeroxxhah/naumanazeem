process:
  - { title: Recon, text: Map the surface — hosts, apps, APIs, and the trust boundaries between them. }
  - { title: Exploit, text: Attack the way an adversary would: manual, measured, and evidence-backed. }
  - { title: Report, text: Findings ranked by real risk, each with a fix that fits the team that owns it. }
  - { title: Verify, text: Retest after remediation so the risk stays closed. }

whyUs:
