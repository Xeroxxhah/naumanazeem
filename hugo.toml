# ── Site ────────────────────────────────────────────────────────────────
baseURL = 'https://naumanazeem.work/'
locale = 'en-US'
title = 'Nauman Azeem — Cybersecurity Engineer & Penetration Tester'
enableRobotsTXT = true

# ── Content ─────────────────────────────────────────────────────────────
